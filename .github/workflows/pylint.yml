name: Pylint

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r .github/requirements/ci-pylint.txt
      - name: Analyse Python errors with pylint
        run: |
          mapfile -d '' py_files < <(git ls-files -z -- '*.py')
          if [[ "${#py_files[@]}" -eq 0 ]]; then
            printf 'No Python files to lint.\n'
            exit 0
          fi
          pylint --errors-only --disable=no-member -- "${py_files[@]}"
