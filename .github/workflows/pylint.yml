name: Pylint

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r .github/requirements/ci-pylint.txt
      - name: Analyse Python errors with pylint
        run: |
          mapfile -d '' py_files < <(git ls-files -z -- '*.py')
          if [[ "${#py_files[@]}" -eq 0 ]]; then
            printf 'No Python files to lint.\n'
            exit 0
          fi
          pylint --errors-only --disable=no-member -- "${py_files[@]}"
