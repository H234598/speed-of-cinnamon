permissions:
  contents: read

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_snap:
        description: "Build snap package"
        required: false
        default: true
        type: boolean
      build_generic_rpm:
        description: "Build generic RPM package"
        required: false
        default: true
        type: boolean

jobs:
  workflow-change-detection:
    runs-on: ubuntu-24.04
    outputs:
      workflows_changed: ${{ steps.detect_workflows.outputs.workflows_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect workflow file changes
        id: detect_workflows
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${BASE_SHA}"
            head="${HEAD_SHA}"
          else
            {
              printf 'workflows_changed<<WORKFLOWS_CHANGED\n'
              printf 'true\n'
              printf 'WORKFLOWS_CHANGED\n'
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${base}" || "${base}" == 0000000000000000000000000000000000000000 ]]; then
            {
              printf 'workflows_changed<<WORKFLOWS_CHANGED\n'
              printf 'true\n'
              printf 'WORKFLOWS_CHANGED\n'
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! "${base}" =~ ^[0-9a-fA-F]{40}$ || ! "${head}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'Invalid pull request comparison revisions.\n' >&2
            exit 1
          fi

          if git diff --name-only "${base}" "${head}" -- .github/workflows/ | grep -qE '\.ya?ml$'; then
            {
              printf 'workflows_changed<<WORKFLOWS_CHANGED\n'
              printf 'true\n'
              printf 'WORKFLOWS_CHANGED\n'
            } >> "${GITHUB_OUTPUT}"
          else
            {
              printf 'workflows_changed<<WORKFLOWS_CHANGED\n'
              printf 'false\n'
              printf 'WORKFLOWS_CHANGED\n'
            } >> "${GITHUB_OUTPUT}"
          fi

  workflow-lint:
    needs: workflow-change-detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install actionlint
        run: |
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          archive_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          actionlint_tmp_dir="$(mktemp -d)"
          trap 'rm -rf -- "${actionlint_tmp_dir}"' EXIT
          archive_path="${actionlint_tmp_dir}/${archive}"
          curl -fsSL -o "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "${archive_sha256}" "${archive_path}" | sha256sum -c -
          tar -xzf "${archive_path}" -C "${actionlint_tmp_dir}" actionlint
          sudo install -m 0755 "${actionlint_tmp_dir}/actionlint" /usr/local/bin/actionlint
      - name: Lint GitHub workflows
        run: |
          if [[ "${WORKFLOWS_CHANGED}" != "true" ]]; then
            echo 'No workflow file changes detected for pull_request; skipping workflow lint.'
            exit 0
          fi

          make lint-workflows
        env:
          WORKFLOWS_CHANGED: ${{ github.event_name != 'pull_request' || needs.workflow-change-detection.outputs.workflows_changed == 'true' }}
          ACTIONLINT_STRICT: "true"

  spelling-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check spelling
        uses: crate-ci/typos@f8a58b6b53f2279f71eb605f03a4ae4d10608f45
        with:
          config: ./typos.toml

  security-scan:
    needs: workflow-lint
    uses: ./.github/workflows/security-scan.yml

  check:
    needs:
      - workflow-lint
      - spelling-lint
      - security-scan
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SNAP_BUILD: ${{ github.event_name != 'workflow_dispatch' && '1' || (inputs.build_snap && '1' || '0') }}
      BUILD_GENERIC_RPM: ${{ github.event_name != 'workflow_dispatch' && '1' || (inputs.build_generic_rpm && '1' || '0') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r .github/requirements/ci-bandit.txt
      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm shellcheck squashfs-tools xclip xdotool xsel
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          archive_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          actionlint_tmp_dir="$(mktemp -d)"
          trap 'rm -rf -- "${actionlint_tmp_dir}"' EXIT
          archive_path="${actionlint_tmp_dir}/${archive}"
          curl -fsSLo "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "${archive_sha256}" "${archive_path}" | sha256sum -c -
          tar -xzf "${archive_path}" -C "${actionlint_tmp_dir}" actionlint
          sudo install -m 0755 "${actionlint_tmp_dir}/actionlint" /usr/local/bin/actionlint
          if [[ "${SNAP_BUILD}" == "1" ]]; then
            if [[ -d /snap/bin ]]; then
              printf '/snap/bin\n' >> "${GITHUB_PATH}"
              export PATH="/snap/bin:${PATH}"
            fi
            snapcraft_expected_version="8.14.5"
            snapcraft_expected_revision="17614"
            if ! snap list snapcraft >/dev/null 2>&1; then
              if command -v -- snap >/dev/null 2>&1; then
                sudo snap install snapcraft --classic --revision="${snapcraft_expected_revision}"
                if [[ -d /snap/bin ]]; then
                  printf '/snap/bin\n' >> "${GITHUB_PATH}"
                  export PATH="/snap/bin:${PATH}"
                fi
              else
                printf 'snap is missing; cannot install snapcraft. Install snapd or set build_snap to false.\n' >&2
                exit 1
              fi
            else
              installed_snapcraft_revision="$(snap list snapcraft | awk 'NR == 2 {print $3}')"
              if [[ "${installed_snapcraft_revision}" != "${snapcraft_expected_revision}" ]]; then
                sudo snap refresh snapcraft --revision="${snapcraft_expected_revision}"
              fi
            fi
            if snap list snapcraft >/dev/null 2>&1; then
              printf '%s\n' '#!/usr/bin/env sh' 'exec snap run snapcraft "$@"' \
                | sudo tee /usr/local/bin/snapcraft >/dev/null
              sudo chmod 0755 /usr/local/bin/snapcraft
            fi
            if ! command -v -- snapcraft >/dev/null 2>&1; then
              printf 'snapcraft is installed but no executable launcher was found.\n' >&2
              exit 1
            fi
            snapcraft_version="$(snapcraft --version | awk '{print $NF}')"
            snapcraft_revision="$(snap list snapcraft | awk 'NR == 2 {print $3}')"
            if [[ "${snapcraft_version}" != "${snapcraft_expected_version}" || "${snapcraft_revision}" != "${snapcraft_expected_revision}" ]]; then
                printf 'Unsupported snapcraft installation: version %s revision %s; expected %s revision %s.\n' \
                  "${snapcraft_version}" "${snapcraft_revision}" "${snapcraft_expected_version}" "${snapcraft_expected_revision}" >&2
                exit 1
            fi
            snapcraft_base="core22"
            snapcraft_base_expected_revision="2411"
            if ! snap list "${snapcraft_base}" >/dev/null 2>&1; then
              sudo snap install "${snapcraft_base}" --revision="${snapcraft_base_expected_revision}"
            else
              installed_snapcraft_base_revision="$(snap list "${snapcraft_base}" | awk 'NR == 2 {print $3}')"
              if [[ "${installed_snapcraft_base_revision}" != "${snapcraft_base_expected_revision}" ]]; then
                sudo snap refresh "${snapcraft_base}" --revision="${snapcraft_base_expected_revision}"
              fi
            fi
            snapcraft_base_revision="$(snap list "${snapcraft_base}" | awk 'NR == 2 {print $3}')"
            if [[ "${snapcraft_base_revision}" != "${snapcraft_base_expected_revision}" ]]; then
              printf 'Could not install required snap base core22.\n' >&2
              exit 1
            fi
            {
              printf 'SNAPCRAFT_BASE<<SNAPCRAFT_BASE\n'
              printf '%s\n' "${snapcraft_base}"
              printf 'SNAPCRAFT_BASE\n'
            } >> "${GITHUB_ENV}"
          else
            printf 'Skipping snap toolchain bootstrap (build_snap=false).\n'
          fi
      - name: Install Python coverage tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r .github/requirements/ci-coverage.txt
      - name: Install project runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r .github/requirements/ci-project.txt
      - name: Run checks
        run: make check
      - name: Generate coverage report
        run: make coverage
      - name: Check QLTY coverage secret
        id: qlty-secret
        if: ${{ github.event_name == 'push' }}
        env:
          QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        run: |
          if [[ -n "${QLTY_COVERAGE_TOKEN}" ]]; then
            printf 'configured=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'configured=false\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload coverage to QLTY
        if: ${{ github.event_name == 'push' && steps.qlty-secret.outputs.configured == 'true' }}
        uses: qltysh/qlty-action/coverage@fd52dc852530a708d68c3b7342f8d33d1df4cd55 # v2.2.1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info
          format: lcov
          cli-version: 0.630.0
      - name: Build and verify release archive
        run: make dist-check
      - name: Build RPM package
        run: make rpm
      - name: Verify RPM payload
        run: make rpm-check
      - name: Build generic RPM package
        run: |
          if [[ "${BUILD_GENERIC_RPM}" == "1" ]]; then
            make rpm-generic
          else
            printf 'Skipping generic RPM package build (build_generic_rpm=false).\n'
          fi
      - name: Verify generic RPM payload
        if: env.BUILD_GENERIC_RPM == '1'
        run: make rpm-generic-check
      - name: Build Snap package
        run: |
          if [[ "${SNAP_BUILD}" == "1" ]]; then
            export PATH="/snap/bin:${PATH}"
            make SNAP_BUILD="${SNAP_BUILD}" snap
          fi
        if: env.SNAP_BUILD == '1'
      - name: Verify Snap package
        if: env.SNAP_BUILD == '1'
        run: |
          export PATH="/snap/bin:${PATH}"
          make SNAP_BUILD="${SNAP_BUILD}" snap-check
      - name: Upload source release archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speed-of-cinnamon-source-${{ github.sha }}
          path: |
            dist/speed-of-cinnamon-*.tar.gz
            dist/speed-of-cinnamon-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Fedora RPM packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speed-of-cinnamon-rpm-${{ github.sha }}
          path: |
            dist/rpmbuild/RPMS/**/*.rpm
            dist/rpmbuild/SRPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30
      - name: Upload generic RPM packages
        if: env.BUILD_GENERIC_RPM == '1' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speed-of-cinnamon-generic-rpm-${{ github.sha }}
          path: |
            dist/rpmbuild-generic/RPMS/**/*.rpm
            dist/rpmbuild-generic/SRPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30
      - name: Upload Snap package
        if: env.SNAP_BUILD == '1' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speed-of-cinnamon-snap-${{ github.sha }}
          path: |
            dist/snap/*.snap
          if-no-files-found: error
          retention-days: 30
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh
