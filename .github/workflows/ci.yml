name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y cpio rpm shellcheck
      - name: Install Python coverage tooling
        run: python -m pip install coverage
      - name: Run checks
        run: make check
      - name: Generate coverage report
        run: make coverage
      - name: Upload coverage to QLTY
        if: ${{ env.QLTY_COVERAGE_TOKEN != '' }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ env.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info
      - name: Build and verify release archive
        run: make dist-check
      - name: Build RPM package
        run: make rpm
      - name: Verify RPM payload
        run: make rpm-check
      - name: Upload source release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: speed-of-cinnamon-source-${{ github.sha }}
          path: |
            dist/speed-of-cinnamon-*.tar.gz
            dist/speed-of-cinnamon-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Fedora RPM packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: speed-of-cinnamon-rpm-${{ github.sha }}
          path: |
            dist/rpmbuild/RPMS/**/*.rpm
            dist/rpmbuild/SRPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh
