name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate or publish"
        required: true
        type: string
      dry_run:
        description: "Run in dry-run mode (validate and report assets without publishing)"
        required: false
        default: false
        type: boolean
      build_snap:
        description: "Build snap package"
        required: false
        default: true
        type: boolean
      build_generic_rpm:
        description: "Build generic RPM package"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  issues: none
  packages: none
  pull-requests: none

concurrency:
  group: release-${{ (github.ref_type == 'tag' && github.ref_name) || (github.event_name == 'workflow_dispatch' && inputs.tag) || github.ref_name }}
  cancel-in-progress: false

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Install actionlint
        run: |
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          archive_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "${archive_sha256}" "/tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
      - name: Lint GitHub workflows
        run: make lint-workflows
        env:
          ACTIONLINT_STRICT: "true"

  security-scan:
    needs: workflow-lint
    uses: ./.github/workflows/security-scan.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  spelling-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Check spelling
        uses: crate-ci/typos@f8a58b6b53f2279f71eb605f03a4ae4d10608f45
        with:
          config: ./typos.toml

  publish:
    needs:
      - workflow-lint
      - spelling-lint
      - security-scan
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      BUILD_SNAP: ${{ github.event_name != 'workflow_dispatch' && '0' || (inputs.build_snap && '1' || '0') }}
      BUILD_GENERIC_RPM: ${{ github.event_name != 'workflow_dispatch' && '1' || (inputs.build_generic_rpm && '1' || '0') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir bandit==1.9.4
          sudo apt-get update
          sudo apt-get install -y cpio rpm shellcheck
          actionlint_version="1.7.12"
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSLo "/tmp/${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}"
          printf '%s  %s\n' "${actionlint_sha256}" "/tmp/${actionlint_archive}" | sha256sum -c -
          tar -xzf "/tmp/${actionlint_archive}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          if [[ "${BUILD_SNAP}" == "1" ]]; then
            if ! command -v -- snapcraft >/dev/null 2>&1; then
              if command -v -- snap >/dev/null 2>&1; then
                sudo snap install snapcraft --classic
              else
                printf 'snap is missing; cannot install snapcraft. Install snapd or set build_snap to false.\n' >&2
                exit 1
              fi
            fi
            snapcraft_base=""
            for candidate in core24 core22; do
              if snap list "${candidate}" >/dev/null 2>&1; then
                snapcraft_base="${candidate}"
                break
              fi
            done
            if [[ -z "${snapcraft_base}" ]]; then
              for candidate in core24 core22; do
                if sudo snap install "${candidate}" --channel=latest/stable; then
                  snapcraft_base="${candidate}"
                  break
                fi
              done
            fi
            if [[ -z "${snapcraft_base}" ]]; then
              printf 'Could not install a compatible snap base (tried core24, core22).\n' >&2
              exit 1
            fi
            {
              printf 'SNAPCRAFT_BASE<<SNAPCRAFT_BASE\n'
              printf '%s\n' "${snapcraft_base}"
              printf 'SNAPCRAFT_BASE\n'
            } >> "${GITHUB_ENV}"
          else
            printf 'Skipping snap toolchain bootstrap (build_snap=false).\n'
          fi
      - name: Verify GitHub CLI
        run: gh --version
      - name: Resolve release tag
        id: release_tag
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            if [[ -z "${tag}" ]]; then
              printf 'workflow_dispatch requires tag input.\n' >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'invalid release tag in workflow: %s\n' "${tag}" >&2
            exit 1
          fi

          project_version="$(python3 -c 'import pathlib, tomllib; data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8")); print(data["project"]["version"])')"
          expected_tag="v${project_version}"

          if [[ "${tag}" != "${expected_tag}" ]]; then
            printf 'release tag mismatch: workflow triggered with %s but pyproject.toml is %s\n' "${tag}" "${expected_tag}" >&2
            exit 1
          fi

          {
            printf 'tag<<TAG\n'
            printf '%s\n' "${tag}"
            printf 'TAG\n'
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${tag}"
      - name: Verify release tag provenance
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          git fetch --force --tags --depth=1 origin "${tag}"
          tag_commit="$(git rev-list -n 1 "${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            printf 'release tag %s points to %s, but checkout is %s\n' "${tag}" "${tag_commit}" "${head_commit}" >&2
            exit 1
          fi
      - name: Verify project
        run: make check
      - name: Build and verify source archive
        run: make dist-check
      - name: Build RPM package
        run: make rpm
      - name: Verify RPM payload
        run: make rpm-check
      - name: Build generic RPM package
        run: |
          if [[ "${BUILD_GENERIC_RPM}" == "1" ]]; then
            make rpm-generic
          else
            printf 'Skipping generic RPM package build (build_generic_rpm=false).\n'
          fi
      - name: Verify generic RPM payload
        if: env.BUILD_GENERIC_RPM == '1'
        run: make rpm-generic-check
      - name: Build Snap package
        run: |
          if [[ "${BUILD_SNAP}" == "1" ]]; then
            make snap
          else
            make SNAP_BUILD=0 snap
          fi
      - name: Verify Snap package
        if: env.BUILD_SNAP == '1'
        run: make snap-check
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh
      - name: Upload source release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speed-of-cinnamon-source-${{ github.sha }}
          path: |
            dist/speed-of-cinnamon-*.tar.gz
            dist/speed-of-cinnamon-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Fedora RPM packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speed-of-cinnamon-rpm-${{ github.sha }}
          path: |
            dist/rpmbuild/RPMS/**/*.rpm
            dist/rpmbuild/SRPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30
      - name: Upload generic RPM packages
        if: env.BUILD_GENERIC_RPM == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speed-of-cinnamon-generic-rpm-${{ github.sha }}
          path: |
            dist/rpmbuild-generic/RPMS/**/*.rpm
            dist/rpmbuild-generic/SRPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30
      - name: Upload Snap package
        if: env.BUILD_SNAP == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speed-of-cinnamon-snap-${{ github.sha }}
          path: |
            dist/snap/*.snap
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && 'false' || (inputs.dry_run && 'true' || 'false') }}
        run: |
          args=()
          if [[ "${BUILD_SNAP}" != "1" ]]; then
            args+=(--skip-snap)
          fi
          if [[ "${BUILD_GENERIC_RPM}" != "1" ]]; then
            args+=(--skip-generic-rpm)
          fi
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          ./scripts/publish-github-release.sh "${args[@]}" "${RELEASE_TAG}"
