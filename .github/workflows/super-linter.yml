---
name: Lint Code Base

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install actionlint
        run: |
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          archive_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          actionlint_tmp_dir="$(mktemp -d)"
          trap 'rm -rf -- "${actionlint_tmp_dir}"' EXIT
          archive_path="${actionlint_tmp_dir}/${archive}"
          curl -fsSL -o "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "${archive_sha256}" "${archive_path}" | sha256sum -c -
          tar -xzf "${archive_path}" -C "${actionlint_tmp_dir}" actionlint
          sudo install -m 0755 "${actionlint_tmp_dir}/actionlint" /usr/local/bin/actionlint

      - name: Lint Python and applet metadata
        run: make lint

      - name: Lint applet JavaScript syntax
        run: node --check files/speed-of-cinnamon@H234598/applet.js

      - name: Lint GitHub workflows
        run: make lint-workflows

      - name: Check whitespace
        run: git diff --check
