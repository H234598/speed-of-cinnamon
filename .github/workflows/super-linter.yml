---
name: Lint Code Base

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install actionlint
        run: |
          version="1.7.12"
          GOBIN="/tmp/actionlint-bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v${version}"
          sudo install -m 0755 /tmp/actionlint-bin/actionlint /usr/local/bin/actionlint

      - name: Lint Python and applet metadata
        run: make lint

      - name: Lint applet JavaScript syntax
        run: node --check files/speed-of-cinnamon@H234598/applet.js

      - name: Lint GitHub workflows
        run: make lint-workflows

      - name: Check whitespace
        run: git diff --check
