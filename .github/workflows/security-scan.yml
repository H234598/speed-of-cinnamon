permissions:
  contents: read

name: Security Scan

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to scan"
        required: false
        type: string

jobs:
  validate-scan-ref:
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.validate.outputs.ref }}
    steps:
      - name: Validate scan ref
        id: validate
        env:
          DEFAULT_REF: ${{ github.ref }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          scan_ref="${INPUT_REF:-${DEFAULT_REF}}"
          if [[ -z "${scan_ref}" ]]; then
            printf 'scan ref must not be empty.\n' >&2
            exit 1
          fi
          if [[ "${scan_ref}" == *$'\n'* || "${scan_ref}" == *$'\r'* || "${scan_ref}" == *$'\t'* ]]; then
            printf 'scan ref contains control characters: %s\n' "${scan_ref}" >&2
            exit 1
          fi
          if [[ "${scan_ref}" == -* || "${scan_ref}" == *..* || "${scan_ref}" == *//* || "${scan_ref}" == *"@{"* || "${scan_ref}" == *\\* || "${scan_ref}" == *.lock || "${scan_ref}" == */ || "${scan_ref}" == *. ]]; then
            printf 'scan ref is not safe: %s\n' "${scan_ref}" >&2
            exit 1
          fi
          if [[ ! ( "${scan_ref}" =~ ^refs/heads/[A-Za-z0-9._/-]+$ || "${scan_ref}" =~ ^refs/tags/[A-Za-z0-9._/-]+$ || "${scan_ref}" =~ ^refs/pull/[0-9]+/(head|merge)$ || "${scan_ref}" =~ ^[0-9a-fA-F]{40}$ ) ]]; then
            printf 'scan ref is not an allowed ref form: %s\n' "${scan_ref}" >&2
            exit 1
          fi
          {
            printf 'ref<<REF\n'
            printf '%s\n' "${scan_ref}"
            printf 'REF\n'
          } >> "${GITHUB_OUTPUT}"

  python-security:
    needs: validate-scan-ref
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate-scan-ref.outputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r .github/requirements/ci-bandit.txt
      - name: Run Python security scan
        run: make python-security-scan

  shell-security:
    needs: validate-scan-ref
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate-scan-ref.outputs.ref }}
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Run shell security scan
        run: make shell-security-scan
