permissions:
  contents: read

name: Security Scan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  python-security:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --disable-pip-version-check --no-cache-dir bandit
      - name: Run Python security scan
        run: make python-security-scan

  shell-security:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Run shell security scan
        run: make shell-security-scan
