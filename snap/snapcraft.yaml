name: speed-of-cinnamon
base: core22
architectures:
  - amd64
version: git
title: Speed of Cinnamon
summary: Cinnamon-native voice typing helper
description: |
  Speed of Cinnamon is a Cinnamon-native voice typing applet and backend.
  This build captures the Python source and command entrypoint as a snap.
contact: "mailto:54270221+H234598@users.noreply.github.com"
license: MIT
grade: stable
confinement: strict
website: https://github.com/H234598/speed-of-cinnamon
source-code: https://github.com/H234598/speed-of-cinnamon
issues: https://github.com/H234598/speed-of-cinnamon/issues
donation: https://github.com/sponsors/H234598

parts:
  app:
    plugin: dump
    # Generated only by scripts/build-snap.sh inside its private workspace.
    source: .snap-source
    build-packages:
      - python3-pip
    stage-packages:
      - python3-minimal
      - libsecret-tools
    override-build: |
      craftctl default
      python3 -m pip install \
        --disable-pip-version-check \
        --no-cache-dir \
        --target="${CRAFT_PART_INSTALL}/usr/lib/python3/dist-packages" \
        --require-hashes \
        -r "${CRAFT_PROJECT_DIR}/snap/local/requirements.txt"
    override-prime: |
      craftctl default
      find "${CRAFT_PRIME}" -type d -name "__pycache__" -prune -exec rm -rf -- {} +
      find "${CRAFT_PRIME}" -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete
    organize:
      snap/local/bin/speed-of-cinnamon: bin/speed-of-cinnamon

apps:
  speed-of-cinnamon:
    command: bin/speed-of-cinnamon
    plugs:
      - home
      - network
      - pulseaudio
      - x11
